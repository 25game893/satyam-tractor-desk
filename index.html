
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Satyam Tractor Desk - Enterprise Showroom Management</title>
    <style>
      :root {
        --brand-primary: #f97316;
        --brand-secondary: #6366f1;
        --ui-bg: #f8fafc;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--ui-bg);
        background-image: 
          radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.03) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(99, 102, 241, 0.03) 0px, transparent 50%);
        color: #0f172a;
        letter-spacing: -0.02em;
        overflow-x: hidden;
      }
      
      /* Premium Grid Overlay */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: linear-gradient(rgba(15, 23, 42, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(15, 23, 42, 0.02) 1px, transparent 1px);
        background-size: 40px 40px;
        z-index: -1;
        pointer-events: none;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 20px; border: 2px solid #f1f5f9; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

      /* Global Animations */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.98); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-fade-up { animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .animate-scale-in { animation: scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

      /* Interaction States */
      .hover-lift {
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
      }
      .hover-lift:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.1);
      }
      
      /* Utility Glassmorphism */
      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      @media print {
        .no-print { display: none !important; }
        body { background: white !important; margin: 0 !important; padding: 0 !important; }
        body::before { display: none !important; }
        #root > div:not(.print-container) { display: none !important; }
        .print-container { display: block !important; position: static !important; width: 100% !important; height: auto !important; overflow: visible !important; }
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
